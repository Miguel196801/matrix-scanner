name: MATRIX PRO — Monitor Telegram

on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'
    - cron: '30 7,8 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità esecuzione (auto | intraday | sabato | test)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - intraday
          - sabato
          - test

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze leggere
        run: pip install --upgrade pip && pip install yfinance pandas numpy requests

      - name: Esegui Monitor Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_FABIO: ${{ secrets.TELEGRAM_CHAT_ID_FABIO }}
          TELEGRAM_CHAT_ID_LISI: ${{ secrets.TELEGRAM_CHAT_ID_LISI }}
          TELEGRAM_CHAT_ID_ALESSIA: ${{ secrets.TELEGRAM_CHAT_ID_ALESSIA }}
        run: python monitor_telegram.py --mode "${{ github.event.inputs.mode || 'auto' }}"

      - name: Salva stato anti-duplicati su GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          if [ -n "$(git status --porcelain telegram_monitor_state.json)" ]; then
            git add telegram_monitor_state.json
            git commit -m "chore(telegram): aggiorna stato alert [skip ci]"
            git pull --rebase origin main
            git push
          fi

